<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment | Ataraxy Wellness Spa</title>
    <style>
        :root {
            --primary: #5e6d62; 
            --accent: #b8977e;  
            --light: #f9f7f2;   
            --dark: #2c3332;    
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Optima', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            min-height: 100vh;
        }

        /* NAVIGATION */
        nav {
            background: var(--dark);
            padding: 0 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed; 
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
            height: 80px; 
        }

        .logo { 
            font-size: 1.2rem; 
            font-weight: bold; 
            color: white; 
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-links { display: flex; list-style: none; align-items: center; }

        .nav-links a { 
            display: block;
            padding: 28px 20px; 
            text-decoration: none; 
            color: white; 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            transition: 0.3s;
        }

        .nav-links a:hover { color: var(--accent); background: rgba(255,255,255,0.03); }

        .hamburger { 
            display: none; 
            cursor: pointer; 
            flex-direction: column; 
            gap: 2px; 
            padding: 10px;
        }

        .hamburger span { width: 25px; height: 2px; background: white; }

        @media (max-width: 950px) {
            .hamburger { display: flex; }
            .nav-links {
                display: none; 
                flex-direction: column;
                position: absolute;
                top: 80px; 
                left: 0;
                width: 100%;
                background: var(--dark);
                padding: 0; 
                text-align: center;
                box-shadow: 0 10px 15px rgba(0,0,0,0.2);
            }
            .nav-links.active { display: flex; }
            .nav-links li { width: 100%; }
            .nav-links a { padding: 25px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        }

        /* FORM STYLES */
        .booking-section { padding: 160px 20px 60px; display: flex; flex-direction: column; align-items: center; }
        .booking-container { width: 100%; max-width: 1200px; background: white; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: var(--primary); text-transform: uppercase; letter-spacing: 6px; font-weight: 300; margin-bottom: 40px; }

        form { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; justify-content: center; }
        .form-group { display: flex; flex-direction: column; flex: 1; min-width: 180px; }

        label { margin-bottom: 8px; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--primary); font-weight: 600; }
        
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #e8e8e8; font-family: inherit; font-size: 0.85rem; background-color: #fafafa; }
        textarea { resize: none; height: 44px; transition: 0.3s; }
        textarea:focus { height: 100px; border-color: var(--accent); outline: none; }

        .treatment-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }

        .btn-add { background: none; border: none; color: var(--accent); padding: 5px 0; font-size: 0.65rem; cursor: pointer; text-transform: uppercase; }
        .btn-remove { background: #fdf2f2; border: 1px solid #fee2e2; color: #b91c1c; cursor: pointer; padding: 0 12px; height: 44px; }
        .btn-submit { background: var(--primary); color: white; padding: 12px 30px; border: none; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.3s; font-size: 0.8rem; height: 44px; }

        .home-service-fields { width: 100%; display: none; flex-wrap: wrap; gap: 15px; margin-top: 20px; padding-top: 20px; border-top: 1px dashed #eee; }
        .home-service-fields .form-group { flex: 1; min-width: 250px; }

        /* MODAL & OVERLAY */
        .modal-overlay, .success-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; justify-content: center; align-items: center; }
        .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); }
        .success-overlay { background: rgba(255, 255, 255, 0.95); z-index: 3000; text-align: center; }
        .modal-content { background: white; padding: 40px; max-width: 500px; width: 90%; position: relative; }
        .modal-content h2 { color: var(--primary); text-transform: uppercase; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: #999; }
        .spinner { width: 50px; height: 50px; border: 3px solid #eee; border-top: 3px solid var(--accent); border-radius: 50%; margin: 0 auto; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 950px) { form { flex-direction: column; align-items: stretch; } .form-group { width: 100%; } }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Ataraxy Wellness Spa</a>
        <ul class="nav-links" id="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="treatment.html">Treatments</a></li>
            <li><a href="booking.html">Booking</a></li>
        </ul>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </nav>

    <main class="booking-section">
        <div class="booking-container">
            <h1>Reserve Today</h1>
            <form id="booking-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="client-name" placeholder="Name" required>
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <select id="service-type" onchange="toggleHomeService()" required>
                        <option value="spa">In-Spa</option>
                        <option value="home">Home Service</option>
                    </select>
                </div>

                <div class="form-group" style="flex: 2;">
                    <label>Ritual(s)</label>
                    <div id="treatment-list">
                        <div class="treatment-row">
                            <select name="treatments[]" required>
                                <option value="" disabled selected>Select a treatment</option>
                                <option>Signature Ataraxy Massage</option>
                                <option>Luminous Zen Facial</option>
                                <option>Basalt Ritual (Hot Stone)</option>
                                <option>Sea Salt Polish (Scrub)</option>
                                <option>Aromatherapy Soak</option>
                                <option>Reiki Stillness</option>
                            </select>
                        </div>
                    </div>
                    <button type="button" class="btn-add" onclick="addTreatment()">+ Add Another Ritual</button>
                </div>

                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="book-date" required>
                </div>

                <div class="form-group">
                    <label>Time</label>
                    <input type="time" id="book-time" required>
                </div>

                <div class="form-group" style="flex: 100%;">
                    <label>Special Instructions</label>
                    <textarea id="book-notes" placeholder="Allergies, pressure preference, or notes..."></textarea>
                </div>

                <div style="flex: 100%; margin: 15px 0; display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="terms" onchange="toggleButton()" style="width: 18px; height: 18px; cursor: pointer;">
                    <label for="terms" style="font-size: 0.75rem; color: #666; cursor: pointer; text-transform: none;">
                        I agree to the <span onclick="openModal()" style="text-decoration: underline; color: var(--accent);">Terms & Conditions</span>.
                    </label>
                </div>

                <button type="button" id="submit-btn" class="btn-submit" onclick="sendBooking()" disabled style="opacity: 0.5; cursor: not-allowed;">Book Now</button>

                <div class="home-service-fields" id="home-fields">
                    <div class="form-group">
                        <label>Home Address</label>
                        <input type="text" id="home-address" placeholder="Street, Barangay, City, Landmarks">
                    </div>
                    <div class="form-group">
                        <label>Contact Number</label>
                        <input type="tel" id="home-contact" placeholder="09XX-XXX-XXXX">
                    </div>
                </div>
            </form>
        </div>
    </main>

    <div id="successOverlay" class="success-overlay">
        <div class="success-box">
            <div class="spinner"></div>
            <h2 style="color: var(--primary); margin-top: 20px;">Preparing Your Ritual</h2>
            <p style="color: var(--accent); font-style: italic;">Connecting to WhatsApp...</p>
        </div>
    </div>

    <div id="termsModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2>Spa Policy</h2>
            <p><strong>Cancellation:</strong> 4-hour notice required.</p>
            <p><strong>Home Service:</strong> Transport fee based on distance.</p>
            <button type="button" class="btn-submit" onclick="closeModal()" style="width: 100%; margin-top: 20px;">I Understand</button>
        </div>
    </div>

    <script>
        function toggleMenu() { document.getElementById('nav-links').classList.toggle('active'); }
        function toggleHomeService() {
            const isHome = document.getElementById('service-type').value === 'home';
            document.getElementById('home-fields').style.display = isHome ? 'flex' : 'none';
        }
        function toggleButton() {
            const btn = document.getElementById('submit-btn');
            const isChecked = document.getElementById('terms').checked;
            btn.disabled = !isChecked;
            btn.style.opacity = isChecked ? "1" : "0.5";
            btn.style.cursor = isChecked ? "pointer" : "not-allowed";
        }
        function openModal() { document.getElementById('termsModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('termsModal').style.display = 'none'; }

        function addTreatment() {
            const list = document.getElementById('treatment-list');
            const row = document.createElement('div');
            row.className = 'treatment-row';
            const newSelect = list.querySelector('select').cloneNode(true);
            newSelect.selectedIndex = 0;
            const rm = document.createElement('button');
            rm.type = 'button'; rm.className = 'btn-remove'; rm.innerHTML = '&times;';
            rm.onclick = () => row.remove();
            row.appendChild(newSelect); row.appendChild(rm); list.appendChild(row);
        }

        function sendBooking() {
            const name = document.getElementById('client-name').value;
            const date = document.getElementById('book-date').value;
            const time = document.getElementById('book-time').value;
            const type = document.getElementById('service-type').value;
            const rituals = Array.from(document.querySelectorAll('select[name="treatments[]"]')).map(s => s.value).filter(v => v);

            if(!name || !date || !time || rituals.length === 0) { alert("Complete all fields."); return; }

            document.getElementById('successOverlay').style.display = 'flex';

            let msg = `*NEW BOOKING*%0A*Name:* ${name}%0A*Rituals:* ${rituals.join(", ")}%0A*Date:* ${date}%0A*Time:* ${time}%0A*Loc:* ${type.toUpperCase()}`;
            if(type === 'home') {
                msg += `%0A*Home Address:* ${document.getElementById('home-address').value}%0A*Contact:* ${document.getElementById('home-contact').value}`;
            }
            const notes = document.getElementById('book-notes').value;
            if(notes) msg += `%0A*Notes:* ${notes}`;

            const waLink = `https://wa.me/639310410733?text=${msg}`;

            setTimeout(() => {
                window.location.assign(waLink);
                setTimeout(() => { document.getElementById('successOverlay').style.display = 'none'; }, 2000);
            }, 2000);
        }
    </script>
</body>
</html>
